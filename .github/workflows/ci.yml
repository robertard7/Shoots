name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: write

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  NUGET_XMLDOC_MODE: "skip"
  ENABLE_WINDOWS_CI: "1"
  # Toggle Linux tests without editing the workflow:
  # set to "1" to run tests, "0" to skip.
  RUN_TESTS_LINUX: "1"

jobs:
  runtime-linux:
    name: runtime-linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean artifacts folder
        shell: bash
        run: |
          rm -rf artifacts || true

      - name: Verify provider adapter naming
        shell: bash
        run: bash scripts/verify_provideradapter_naming.sh

      - name: Verify UI test project guard
        shell: bash
        run: bash scripts/verify_ui_test_project_guard.sh

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Dotnet info
        shell: bash
        run: dotnet --info

      - name: Capture CI environment snapshot
        shell: bash
        run: bash scripts/capture_ci_environment.sh

      - name: Verify tool catalog contract
        shell: bash
        run: bash scripts/verify_tool_catalog_contract.sh

      - name: Compute repo fingerprint
        shell: bash
        run: bash scripts/repo_fingerprint.sh

      - name: Verify version consistency
        shell: bash
        run: bash scripts/verify_versions.sh

      - name: Verify dependency lock
        shell: bash
        run: bash scripts/verify_dependency_lock.sh

      - name: Verify repo topology guard
        shell: bash
        run: bash scripts/verify_repo_topology_guard.sh

      - name: Verify no-spin timeout guard
        shell: bash
        run: bash scripts/verify_no_spin_timeouts.sh

      - name: Verify no blocking stubs
        shell: bash
        run: bash scripts/verify_no_blocking_stubs.sh

      - name: Verify script dependencies
        shell: bash
        run: bash scripts/verify_script_dependencies.sh

      - name: Verify docs examples
        shell: bash
        run: bash scripts/verify_docs_examples.sh

      - name: Verify config contract
        shell: bash
        run: bash scripts/verify_config_contract.sh

      - name: Verify input normalization
        shell: bash
        run: bash scripts/verify_input_normalization.sh

      - name: Verify line endings
        shell: bash
        run: bash scripts/verify_line_endings.sh

      - name: Verify codex diagnostics order
        shell: bash
        run: bash scripts/verify_diagnostics_order.sh

      - name: Restore Runtime
        shell: bash
        run: dotnet restore src/Runtime/Shoots.Runtime.sln

      - name: Build UI project (Linux compile gate)
        shell: bash
        run: |
          dotnet restore ui/Shoots.Ui/Shoots.Ui.csproj -p:EnableWindowsTargeting=true
          dotnet build ui/Shoots.Ui/Shoots.Ui.csproj -c Release --no-restore -p:EnableWindowsTargeting=true

      - name: Runner smoke (skip backends)
        shell: bash
        run: |
          bash tools/codex/restore.sh
          bash scripts/smoke_runner.sh --skip-backends
          cat artifacts/smoke/latest_summary.env
          source artifacts/smoke/latest_summary.env
          bash scripts/verify_hash_contract.sh "$RUN_DIR"
          bash scripts/verify_smoke_artifacts.sh "$RUN_DIR"
          bash scripts/verify_scripts_portability.sh
          bash scripts/verify_fixture_integrity.sh
          bash scripts/verify_trace_schema.sh "$RUN_DIR"
          bash scripts/verify_trace_contract.sh "$RUN_DIR"
          bash scripts/verify_manifest_contract.sh "$RUN_DIR"
          bash scripts/verify_artifact_bounds.sh "$RUN_DIR"
          bash scripts/verify_environment_schema.sh "$RUN_DIR"
          bash scripts/verify_trace_correlations.sh "$RUN_DIR"
          bash scripts/verify_execution_ledger.sh "$RUN_DIR"
          bash scripts/verify_filesystem_contract.sh "$RUN_DIR"
          bash scripts/verify_env_drift.sh "$RUN_DIR"
          bash scripts/sample_artifact_repro.sh "$RUN_DIR"
          bash scripts/verify_clock_usage.sh "$RUN_DIR"
          bash scripts/verify_locale_contract.sh "$RUN_DIR"
          bash scripts/verify_state_transitions.sh "$RUN_DIR"
          bash scripts/verify_sorted_hash_inputs.sh
          bash scripts/replay_plan_graph.sh "$RUN_DIR"
          bash scripts/verify_archive_determinism.sh "$RUN_DIR"
          bash scripts/verify_tempfile_contract.sh "$RUN_DIR"
          bash scripts/build_artifact_index.sh "$RUN_DIR"
          bash scripts/verify_plan_input_fingerprint.sh "$RUN_DIR"
          bash scripts/verify_artifact_graph.sh "$RUN_DIR"
          bash scripts/verify_trace_ordering.sh "$RUN_DIR"
          bash scripts/verify_path_canonicalization.sh "$RUN_DIR"
          bash scripts/verify_permission_contract.sh "$RUN_DIR"
          bash scripts/verify_randomness_contract.sh
          bash scripts/verify_runner_identity.sh
          bash scripts/verify_memory_profile.sh
          bash scripts/record_ci_metrics.sh "$RUN_DIR"
          bash scripts/determinism_report.sh
          bash scripts/verify_report_integrity.sh
          bash scripts/verify_sorted_hash_inputs.sh

      - name: Build Runtime (Release) with binlog + log
        shell: bash
        run: |
          mkdir -p artifacts
          (dotnet build src/Runtime/Shoots.Runtime.sln -c Release --no-restore -p:ContinuousIntegrationBuild=true /bl:artifacts/build-runtime-linux.binlog) 2>&1 | tee artifacts/build.log

      - name: Test Runtime.Tests (trx) + log
        if: env.RUN_TESTS_LINUX == '1'
        shell: bash
        run: |
          mkdir -p artifacts
          (dotnet test src/Runtime/Shoots.Runtime.Tests/Shoots.Runtime.Tests.csproj -c Release --no-build -p:ContinuousIntegrationBuild=true --logger "trx;LogFileName=artifacts/runtime-linux.trx") 2>&1 | tee artifacts/test-runtime.log

      - name: Test Builder.Tests (trx) + log
        if: env.RUN_TESTS_LINUX == '1'
        shell: bash
        run: |
          mkdir -p artifacts
          (dotnet test src/Builder/Shoots.Builder.Tests/Shoots.Builder.Tests.csproj -c Release --no-build -p:ContinuousIntegrationBuild=true --logger "trx;LogFileName=artifacts/builder-linux.trx") 2>&1 | tee artifacts/test-builder.log

      - name: Builder loop scenario
        if: env.RUN_TESTS_LINUX == '1'
        shell: bash
        run: bash scripts/builder_loop.sh

      - name: Verify step envelopes
        if: env.RUN_TESTS_LINUX == '1'
        shell: bash
        run: bash scripts/verify_step_envelopes.sh --require-run

      - name: Golden builder replay check
        if: env.RUN_TESTS_LINUX == '1'
        shell: bash
        run: |
          outdir="artifacts/golden"
          mkdir -p "$outdir"

          dotnet run -c Release --project src/Runtime/Shoots.Runtime.Runner -- run --scenario builder_smoke --project etc/fixtures/builder_smoke/project --out "$outdir/base"
          run_dir="$(find "$outdir/base" -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)"
          dotnet run -c Release --project src/Runtime/Shoots.Runtime.Runner -- replay --run "$run_dir"

          dotnet run -c Release --project src/Runtime/Shoots.Runtime.Runner -- run --scenario builder_smoke --project etc/fixtures/builder_smoke_success_args/project --out "$outdir/success-args"
          run_dir_args="$(find "$outdir/success-args" -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)"
          dotnet run -c Release --project src/Runtime/Shoots.Runtime.Runner -- replay --run "$run_dir_args"

          if dotnet run -c Release --project src/Runtime/Shoots.Runtime.Runner -- run --scenario builder_smoke --project etc/fixtures/builder_smoke_failure/project --out "$outdir/failure"; then
            echo "expected failure fixture to fail"
            exit 1
          fi

          if dotnet run -c Release --project src/Runtime/Shoots.Runtime.Runner -- run --scenario builder_smoke --project etc/fixtures/builder_smoke_invalid_kind/project --out "$outdir/invalid-kind"; then
            echo "expected invalid kind fixture to fail"
            exit 1
          fi

          python - <<'PYCHK'
import json, pathlib
expected = json.loads(pathlib.Path('etc/fixtures/builder_smoke/expected-hashes.json').read_text())
run_dir = sorted(pathlib.Path('artifacts/golden/base').glob('*'))[-1]
actual = json.loads((run_dir / 'hashes.json').read_text())
for key in ['runId','planHash','providerHash','envHash']:
    if actual.get(key) != expected.get(key):
        raise SystemExit(f'mismatch for {key}: {actual.get(key)} != {expected.get(key)}')
PYCHK

      - name: Codex entrypoint retrieval
        if: env.RUN_TESTS_LINUX == '1'
        shell: bash
        run: bash scripts/codex_entrypoint.sh --retrieval

      - name: Codex entrypoint all
        if: env.RUN_TESTS_LINUX == '1'
        shell: bash
        run: bash scripts/codex_entrypoint.sh --all

      - name: Collect failure bundle (runner smoke)
        if: failure()
        shell: bash
        run: |
          if [[ -f artifacts/smoke/latest_summary.env ]]; then
            source artifacts/smoke/latest_summary.env
            if [[ -n "${RUN_DIR:-}" && -d "$RUN_DIR" ]]; then
              bash scripts/collect_failure_bundle.sh "$RUN_DIR"
              bash scripts/verify_failure_bundle_schema.sh artifacts/failure_bundle.tgz
            fi
          fi

      - name: Write CI first-failure summary (always)
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          tailfile="artifacts/test-runtime.log"
          if [ -f "artifacts/test-builder.log" ]; then tailfile="artifacts/test-builder.log"; fi
          if [ ! -f "$tailfile" ] && [ -f "artifacts/build.log" ]; then tailfile="artifacts/build.log"; fi

          {
            echo "# CI first-failure summary"
            echo
            echo "Workflow: $GITHUB_WORKFLOW"
            echo "Job: runtime-linux"
            echo "Run: $GITHUB_RUN_ID"
            echo "Commit: $GITHUB_SHA"
            echo
            echo "Failure excerpt (tail):"
            echo '```'
            if [ -f "$tailfile" ]; then tail -n 120 "$tailfile"; else echo "<no local log captured>"; fi
            echo '```'
          } > artifacts/ci-first-failure.md

      - name: Upload CI artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-linux-artifacts
          path: |
            artifacts/**
            artifacts/**/*.trx
            artifacts/**/*.binlog
            artifacts/**/*.log
            artifacts/**/ci-first-failure.md
            artifacts/stubs/**
            artifacts/builder_loop/**
            artifacts/golden/**
            artifacts/retrieval/**
            runs/**
            .state/runs/**
            etc/tools.catalog.json
            etc/fixtures/**
            docs/**
          if-no-files-found: warn

  full-windows:
    name: full-windows
    if: env.ENABLE_WINDOWS_CI == '1'
    runs-on: [self-hosted, Windows, X64, Shoots]
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Environment sanity (Windows + PowerShell)
        run: |
          Write-Host "OS: $([System.Runtime.InteropServices.RuntimeInformation]::OSDescription)"
          Write-Host "PowerShell edition: $($PSVersionTable.PSEdition)"
          if (-not $IsWindows) { throw "This job must run on Windows." }
          if (-not (Get-Command pwsh -ErrorAction SilentlyContinue)) { throw "pwsh is required but not found." }

      - name: Runner health
        run: ./scripts/runner_health.ps1

      - name: Verify provider adapter naming
        run: ./scripts/verify_provideradapter_naming.ps1

      - name: Verify UI test project guard
        run: ./scripts/verify_ui_test_project_guard.ps1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Dotnet info
        run: dotnet --info

      - name: Verify version consistency
        run: ./scripts/verify_versions.ps1

      - name: Verify repo topology guard
        run: ./scripts/verify_repo_topology_guard.ps1

      - name: Verify no-spin timeout guard
        run: ./scripts/verify_no_spin_timeouts.ps1

      - name: Restore
        run: dotnet restore Shoots.sln

      - name: Build (Release) with binlog + log
        run: |
          New-Item -Force -ItemType Directory artifacts | Out-Null
          dotnet build Shoots.sln -c Release --no-restore -p:ContinuousIntegrationBuild=true /bl:artifacts\build-release.binlog 2>&1 | Tee-Object -FilePath artifacts\build.log

      - name: Test (Release) with TRX + log
        run: |
          New-Item -Force -ItemType Directory artifacts\trx | Out-Null
          dotnet test Shoots.sln -c Release -v minimal --no-build -p:ContinuousIntegrationBuild=true --logger "trx;LogFileName=artifacts\trx\full-windows.trx" 2>&1 | Tee-Object -FilePath artifacts\test.log

      - name: Host smoke
        run: pwsh -NoLogo -NoProfile -File .\scripts\run_host_smoke.ps1

      - name: Collect smoke artifacts (windows)
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts/smoke/${{ github.run_id }}" | Out-Null
          if (Test-Path .state/trace) { Copy-Item -Recurse -Force .state/trace "artifacts/smoke/${{ github.run_id }}/trace" }
          if (Test-Path .state/artifacts) { Copy-Item -Recurse -Force .state/artifacts "artifacts/smoke/${{ github.run_id }}/artifacts" }

      - name: Package UI zip
        run: ./scripts/package_ui.ps1 -Configuration Release -Version "${{ github.run_number }}"

      - name: Upload UI package
        uses: actions/upload-artifact@v4
        with:
          name: shoots-ui-zip
          path: artifacts/ui/${{ github.run_number }}/Shoots.Ui.zip

      - name: Package release bundle
        run: ./scripts/package_all.ps1 -Configuration Release

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: shoots-release-bundle
          path: artifacts/release/*/Shoots-*.zip

      - name: Write CI first-failure summary (always)
        if: always()
        run: |
          New-Item -Force -ItemType Directory artifacts | Out-Null
          $tailFile = "artifacts\test.log"
          if (-not (Test-Path $tailFile)) { $tailFile = "artifacts\build.log" }

          $excerpt = "<no local log captured>"
          if (Test-Path $tailFile) { $excerpt = (Get-Content $tailFile -Tail 120) -join "`n" }

          @(
            "# CI first-failure summary"
            ""
            "Workflow: $env:GITHUB_WORKFLOW"
            "Job: full-windows"
            "Run: $env:GITHUB_RUN_ID"
            "Commit: $env:GITHUB_SHA"
            ""
            "Failure excerpt (tail):"
            "```"
            $excerpt
            "```"
          ) | Out-File -Encoding utf8 artifacts\ci-first-failure.md

      - name: Upload CI artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-windows-artifacts
          path: |
            artifacts/**
            artifacts/**/*.trx
            artifacts/**/*.binlog
            artifacts/**/*.log
            artifacts/**/ci-first-failure.md
            artifacts/stubs/**
            artifacts/builder_loop/**
            artifacts/golden/**
            artifacts/retrieval/**
            runs/**
            .state/runs/**
            etc/tools.catalog.json
          if-no-files-found: warn

  release-candidate-pack:
    name: release-candidate-pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean artifacts folder
        shell: bash
        run: rm -rf artifacts || true

      - name: Verify UI test project guard
        shell: bash
        run: bash scripts/verify_ui_test_project_guard.sh

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Dotnet info
        shell: bash
        run: dotnet --info

      - name: Capture CI environment snapshot
        shell: bash
        run: bash scripts/capture_ci_environment.sh

      - name: Verify tool catalog contract
        shell: bash
        run: bash scripts/verify_tool_catalog_contract.sh

      - name: Compute repo fingerprint
        shell: bash
        run: bash scripts/repo_fingerprint.sh

      - name: Verify version consistency
        shell: bash
        run: bash scripts/verify_versions.sh

      - name: Verify dependency lock
        shell: bash
        run: bash scripts/verify_dependency_lock.sh

      - name: Restore
        shell: bash
        run: dotnet restore src/Runtime/Shoots.Runtime.sln

      - name: Build host/runtime/smoke (Release) with binlog + log
        shell: bash
        run: |
          mkdir -p artifacts
          (dotnet build src/Runtime/Shoots.Runtime.sln -c Release --no-restore -p:ContinuousIntegrationBuild=true /bl:artifacts/build-rc-linux.binlog) 2>&1 | tee artifacts/build.log

      - name: Test runtime + host + client (log)
        shell: bash
        run: |
          mkdir -p artifacts
          (dotnet test src/Runtime/Shoots.Runtime.Tests/Shoots.Runtime.Tests.csproj -c Release -m:1 -p:ContinuousIntegrationBuild=true) 2>&1 | tee artifacts/test-runtime.log
          (dotnet test src/Host/Shoots.Host.Tests/Shoots.Host.Tests.csproj -c Release -m:1 -p:ContinuousIntegrationBuild=true) 2>&1 | tee artifacts/test-host.log
          (dotnet test src/Client/Shoots.Client.Tests/Shoots.Client.Tests.csproj -c Release -m:1 -p:ContinuousIntegrationBuild=true) 2>&1 | tee artifacts/test-client.log

      - name: Pack release candidate
        shell: bash
        run: |
          mkdir -p artifacts/nuget
          dotnet pack src/Contracts/Shoots.Contracts.Core/Shoots.Contracts.Core.csproj -c Release -o artifacts/nuget
          dotnet pack src/Host/Shoots.Host.Abstractions/Shoots.Host.Abstractions.csproj -c Release -o artifacts/nuget
          dotnet pack src/Runtime/Shoots.Runtime.Abstractions/Shoots.Runtime.Abstractions.csproj -c Release -o artifacts/nuget
          dotnet pack src/Client/Shoots.Client/Shoots.Client.csproj -c Release -o artifacts/nuget

      - name: Write CI first-failure summary (always)
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          tailfile="artifacts/test-client.log"
          if [ -f "artifacts/test-host.log" ]; then tailfile="artifacts/test-host.log"; fi
          if [ -f "artifacts/test-runtime.log" ]; then tailfile="artifacts/test-runtime.log"; fi
          if [ ! -f "$tailfile" ] && [ -f "artifacts/build.log" ]; then tailfile="artifacts/build.log"; fi

          {
            echo "# CI first-failure summary"
            echo
            echo "Workflow: $GITHUB_WORKFLOW"
            echo "Job: release-candidate-pack"
            echo "Run: $GITHUB_RUN_ID"
            echo "Commit: $GITHUB_SHA"
            echo
            echo "Failure excerpt (tail):"
            echo '```'
            if [ -f "$tailfile" ]; then tail -n 120 "$tailfile"; else echo "<no local log captured>"; fi
            echo '```'
          } > artifacts/ci-first-failure.md

      - name: Upload CI artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc-linux-artifacts
          path: |
            artifacts/**
            artifacts/**/*.trx
            artifacts/**/*.binlog
            artifacts/**/*.log
            artifacts/**/ci-first-failure.md
            artifacts/stubs/**
            artifacts/builder_loop/**
            .state/runs/**
          if-no-files-found: warn

  determinism-guard:
    name: determinism-guard
    if: env.ENABLE_WINDOWS_CI == '1'
    runs-on: [self-hosted, Windows, X64, Shoots]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Environment sanity (Windows + PowerShell)
        run: |
          Write-Host "OS: $([System.Runtime.InteropServices.RuntimeInformation]::OSDescription)"
          Write-Host "PowerShell edition: $($PSVersionTable.PSEdition)"
          if (-not $IsWindows) { throw "This job must run on Windows." }
          if (-not (Get-Command pwsh -ErrorAction SilentlyContinue)) { throw "pwsh is required but not found." }

      - name: Runner health
        run: ./scripts/runner_health.ps1

      - name: Verify provider adapter naming
        run: ./scripts/verify_provideradapter_naming.ps1

      - name: Verify UI test project guard
        run: ./scripts/verify_ui_test_project_guard.ps1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Dotnet info
        run: dotnet --info

      - name: Verify version consistency
        run: ./scripts/verify_versions.ps1

      - name: Verify repo topology guard
        run: ./scripts/verify_repo_topology_guard.ps1

      - name: Restore
        run: dotnet restore src/Runtime/Shoots.Runtime.sln

      - name: Build Runtime (Release) with binlog + log
        run: |
          New-Item -Force -ItemType Directory artifacts | Out-Null
          dotnet build src/Runtime/Shoots.Runtime.sln -c Release --no-restore -p:ContinuousIntegrationBuild=true /bl:artifacts\build-determinism.binlog 2>&1 | Tee-Object -FilePath artifacts\build.log

      - name: Determinism pass 1 (trx) + log
        run: |
          dotnet test src/Runtime/Shoots.Runtime.sln -c Release --no-build -p:ContinuousIntegrationBuild=true --filter "FullyQualifiedName~Trace_replays_deterministically" --logger "trx;LogFileName=artifacts\determinism-pass-1.trx" 2>&1 | Tee-Object -FilePath artifacts\test-pass-1.log

      - name: Determinism pass 2 (trx) + log
        run: |
          dotnet test src/Runtime/Shoots.Runtime.sln -c Release --no-build -p:ContinuousIntegrationBuild=true --filter "FullyQualifiedName~Trace_replays_deterministically" --logger "trx;LogFileName=artifacts\determinism-pass-2.trx" 2>&1 | Tee-Object -FilePath artifacts\test-pass-2.log

      - name: Write CI first-failure summary (always)
        if: always()
        run: |
          New-Item -Force -ItemType Directory artifacts | Out-Null
          $tailFile = "artifacts\test-pass-2.log"
          if (-not (Test-Path $tailFile)) { $tailFile = "artifacts\test-pass-1.log" }
          if (-not (Test-Path $tailFile)) { $tailFile = "artifacts\build.log" }

          $excerpt = "<no local log captured>"
          if (Test-Path $tailFile) { $excerpt = (Get-Content $tailFile -Tail 120) -join "`n" }

          @(
            "# CI first-failure summary"
            ""
            "Workflow: $env:GITHUB_WORKFLOW"
            "Job: determinism-guard"
            "Run: $env:GITHUB_RUN_ID"
            "Commit: $env:GITHUB_SHA"
            ""
            "Failure excerpt (tail):"
            "```"
            $excerpt
            "```"
          ) | Out-File -Encoding utf8 artifacts\ci-first-failure.md

      - name: Upload CI artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: determinism-artifacts
          path: |
            artifacts/**
            artifacts/**/*.trx
            artifacts/**/*.binlog
            artifacts/**/*.log
            artifacts/**/ci-first-failure.md
            artifacts/stubs/**
            artifacts/builder_loop/**
            .state/runs/**
          if-no-files-found: warn
