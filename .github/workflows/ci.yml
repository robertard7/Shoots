name: ci

on:
  push:
  pull_request:

jobs:
  runtime-linux:
    name: runtime-linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify provider adapter naming
        run: bash scripts/verify_provideradapter_naming.sh

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify version consistency
        run: bash scripts/verify_versions.sh

      - name: Verify repo topology guard
        run: bash scripts/verify_repo_topology_guard.sh

      - name: Verify no-spin timeout guard
        run: bash scripts/verify_no_spin_timeouts.sh

      - name: Restore Runtime
        run: dotnet restore src/Runtime/Shoots.Runtime.sln

      - name: Build Runtime
        run: dotnet build src/Runtime/Shoots.Runtime.sln -c Release --no-restore

      - name: Test Runtime (trx)
        run: dotnet test src/Runtime/Shoots.Runtime.sln -c Release --no-build --logger "trx;LogFileName=runtime-linux.trx"

      - name: Test Host contracts/core (trx)
        run: dotnet test src/Host/Shoots.Host.Tests/Shoots.Host.Tests.csproj -c Release --logger "trx;LogFileName=host-linux.trx"

      - name: Test Client (trx)
        run: dotnet test src/Client/Shoots.Client.Tests/Shoots.Client.Tests.csproj -c Release --logger "trx;LogFileName=client-linux.trx"

      - name: Run tools smoke
        run: bash scripts/run_tools_smoke.sh

      - name: Runtime hang probe (blame-hang)
        run: dotnet test src/Runtime/Shoots.Runtime.sln -c Release --no-build -m:1 --blame-hang --blame-hang-timeout 2m --filter "FullyQualifiedName~RoutingLoopTests|FullyQualifiedName~RouteGateTests"

      - name: Host smoke (ChatIntakeSmoke)
        run: dotnet run --project src/Host/Shoots.Host.Smoke/Shoots.Host.Smoke.csproj -c Release -- ChatIntakeSmoke

      - name: Run Client sample golden flow
        run: dotnet run --project src/Client/Shoots.Client.Sample/Shoots.Client.Sample.csproj -c Release

      - name: Collect smoke artifacts (linux)
        run: |
          mkdir -p artifacts/smoke/${{ github.run_id }}
          cp -r .state/trace artifacts/smoke/${{ github.run_id }}/trace || true
          cp -r .state/artifacts artifacts/smoke/${{ github.run_id }}/artifacts || true

      - name: Upload runtime artifacts
        uses: actions/upload-artifact@v4
        with:
          name: runtime-linux-artifacts
          path: |
            **/runtime-linux.trx
            **/host-linux.trx
            **/client-linux.trx
            artifacts/smoke/${{ github.run_id }}/**
            etc/tools.catalog.json

  full-windows:
    name: full-windows
    runs-on: [self-hosted, Windows, X64, Shoots]
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Environment sanity (Windows + PowerShell)
        run: |
          Write-Host "OS: $([System.Runtime.InteropServices.RuntimeInformation]::OSDescription)"
          Write-Host "PowerShell edition: $($PSVersionTable.PSEdition)"
          if (-not $IsWindows) { throw "This job must run on Windows." }
          if (-not (Get-Command pwsh -ErrorAction SilentlyContinue)) { throw "pwsh is required but not found." }

      - name: Verify provider adapter naming
        run: ./scripts/verify_provideradapter_naming.ps1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Dotnet info
        run: dotnet --info

      - name: Verify version consistency
        run: ./scripts/verify_versions.ps1

      - name: Verify repo topology guard
        run: ./scripts/verify_repo_topology_guard.ps1

      - name: Verify no-spin timeout guard
        run: ./scripts/verify_no_spin_timeouts.ps1

      - name: Restore
        run: dotnet restore Shoots.sln

      - name: Build
        run: dotnet build Shoots.sln -c Release --no-restore

      - name: Test
        run: dotnet test Shoots.sln -c Release -v minimal --no-build

      - name: Host smoke
        run: pwsh -NoLogo -NoProfile -File .\scripts\run_host_smoke.ps1

      - name: Collect smoke artifacts (windows)
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts/smoke/${{ github.run_id }}" | Out-Null
          if (Test-Path .state/trace) { Copy-Item -Recurse -Force .state/trace "artifacts/smoke/${{ github.run_id }}/trace" }
          if (Test-Path .state/artifacts) { Copy-Item -Recurse -Force .state/artifacts "artifacts/smoke/${{ github.run_id }}/artifacts" }

      - name: Package UI zip
        run: ./scripts/package_ui.ps1 -Configuration Release -Version "${{ github.run_number }}"

      - name: Upload UI package
        uses: actions/upload-artifact@v4
        with:
          name: shoots-ui-zip
          path: artifacts/ui/${{ github.run_number }}/Shoots.Ui.zip

      - name: Package release bundle
        run: ./scripts/package_all.ps1 -Configuration Release

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: shoots-release-bundle
          path: artifacts/release/*/Shoots-*.zip

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: full-windows-artifacts
          path: |
            **/*.trx
            artifacts/smoke/${{ github.run_id }}/**
            etc/tools.catalog.json


  release-candidate-pack:
    name: release-candidate-pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify version consistency
        run: bash scripts/verify_versions.sh

      - name: Build host/runtime/smoke
        run: dotnet build src/Runtime/Shoots.Runtime.sln -c Release

      - name: Test runtime + host
        run: |
          dotnet test src/Runtime/Shoots.Runtime.Tests/Shoots.Runtime.Tests.csproj -c Release -m:1
          dotnet test src/Host/Shoots.Host.Tests/Shoots.Host.Tests.csproj -c Release -m:1
          dotnet test src/Client/Shoots.Client.Tests/Shoots.Client.Tests.csproj -c Release -m:1

      - name: Pack release candidate
        run: |
          mkdir -p artifacts/nuget
          dotnet pack src/Contracts/Shoots.Contracts.Core/Shoots.Contracts.Core.csproj -c Release -o artifacts/nuget
          dotnet pack src/Host/Shoots.Host.Abstractions/Shoots.Host.Abstractions.csproj -c Release -o artifacts/nuget
          dotnet pack src/Runtime/Shoots.Runtime.Abstractions/Shoots.Runtime.Abstractions.csproj -c Release -o artifacts/nuget
          dotnet pack src/Client/Shoots.Client/Shoots.Client.csproj -c Release -o artifacts/nuget

      - name: Upload nuget artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rc-nuget-packages
          path: artifacts/nuget/*

  determinism-guard:
    name: determinism-guard
    runs-on: [self-hosted, Windows, X64, Shoots]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Environment sanity (Windows + PowerShell)
        run: |
          Write-Host "OS: $([System.Runtime.InteropServices.RuntimeInformation]::OSDescription)"
          Write-Host "PowerShell edition: $($PSVersionTable.PSEdition)"
          if (-not $IsWindows) { throw "This job must run on Windows." }
          if (-not (Get-Command pwsh -ErrorAction SilentlyContinue)) { throw "pwsh is required but not found." }

      - name: Verify provider adapter naming
        run: ./scripts/verify_provideradapter_naming.ps1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Dotnet info
        run: dotnet --info

      - name: Verify version consistency
        run: ./scripts/verify_versions.ps1

      - name: Verify repo topology guard
        run: ./scripts/verify_repo_topology_guard.ps1

      - name: Restore
        run: dotnet restore src/Runtime/Shoots.Runtime.sln

      - name: Build
        run: dotnet build src/Runtime/Shoots.Runtime.sln -c Release --no-restore

      - name: Determinism pass 1 (trx)
        run: dotnet test src/Runtime/Shoots.Runtime.sln -c Release --no-build --filter "FullyQualifiedName~Trace_replays_deterministically" --logger "trx;LogFileName=determinism-pass-1.trx"

      - name: Determinism pass 2 (trx)
        run: dotnet test src/Runtime/Shoots.Runtime.sln -c Release --no-build --filter "FullyQualifiedName~Trace_replays_deterministically" --logger "trx;LogFileName=determinism-pass-2.trx"

      - name: Upload determinism artifacts
        uses: actions/upload-artifact@v4
        with:
          name: determinism-artifacts
          path: |
            **/determinism-pass-1.trx
            **/determinism-pass-2.trx
