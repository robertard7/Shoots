name: shoots

services:
  # -------------------------
  # Linux runner (optional)
  # A stable place to run Linux tools from Windows.
  # -------------------------
  runner:
    image: ubuntu:24.04
    container_name: shoots-runner
    profiles: ["linux"]
    init: true
    working_dir: /work
    # Keep it alive:
    command: ["bash", "-lc", "sleep infinity"]
    volumes:
      # Mount your repo into the container
      - ./:/work:rw
    environment:
      - DEBIAN_FRONTEND=noninteractive
    restart: unless-stopped

  # -------------------------
  # Ollama (optional)
  # -------------------------
  ollama:
    image: ollama/ollama:0.17.5
    container_name: shoots-ollama
    profiles: ["ai"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    command: ["serve"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-lc", "wget -qO- http://localhost:11434/api/tags >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 20

  # One-shot model pull (run manually)
  # Usage: docker compose --profile ai run --rm ollama-pull
  ollama-pull:
    image: ollama/ollama:0.17.5
    container_name: shoots-ollama-pull
    profiles: ["ai"]
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      ollama pull qwen2.5:7b-instruct &&
      ollama pull nomic-embed-text &&
      echo "done"
    restart: "no"

  # -------------------------
  # Qdrant (optional)
  # -------------------------
  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: shoots-qdrant
    profiles: ["vecdb"]
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  ollama_data:
  qdrant_data:
