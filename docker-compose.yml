name: shoots

services:
  # -------------------------
  # Ollama (optional)
  # -------------------------
  ollama:
    image: ollama/ollama:0.1.58
    container_name: shoots-ollama
    profiles: ["ai"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    command: ["serve"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-lc", "wget -qO- http://localhost:11434/api/tags >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 15

  # One-shot model pull (optional). Run it when you actually want models pre-pulled.
  # Usage:
  #   docker compose --profile ai run --rm ollama-pull
  ollama-pull:
    image: ollama/ollama:0.1.58
    container_name: shoots-ollama-pull
    profiles: ["ai"]
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      ollama pull qwen2.5:7b-instruct &&
      ollama pull nomic-embed-text &&
      echo "done"
    restart: "no"

  # -------------------------
  # Qdrant (optional)
  # -------------------------
  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: shoots-qdrant
    profiles: ["vecdb"]
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-lc", "wget -qO- http://localhost:6333/readyz >/dev/null 2>&1 || wget -qO- http://localhost:6333/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 20

volumes:
  ollama_data:
  qdrant_data:
